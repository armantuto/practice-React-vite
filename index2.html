<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Silo 3D Visible</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body style="margin:0; overflow:hidden;">

<div id="container"></div>

<script>
// ESCENA
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);

// CAMARA
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(6,6,10);
camera.lookAt(0,2,0);

// RENDERER
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LUCES
const dirLight = new THREE.DirectionalLight(0xffffff,1);
dirLight.position.set(5,10,5);
scene.add(dirLight);
scene.add(new THREE.AmbientLight(0x404040,1));

// SILO
const bodyGeom = new THREE.CylinderGeometry(1.5,1.5,4,64);
const bodyMat = new THREE.MeshStandardMaterial({color:0x4b5563, roughness:0.6, metalness:0.3});
const body = new THREE.Mesh(bodyGeom, bodyMat);
body.position.y=2;
scene.add(body);

// CONO SUPERIOR
const coneGeom = new THREE.ConeGeometry(1.5,1.2,64);
const coneMat = new THREE.MeshStandardMaterial({color:0x374151, roughness:0.5, metalness:0.3});
const cone = new THREE.Mesh(coneGeom,coneMat);
cone.position.y=5;
scene.add(cone);

// CEMENTO (AHORA VISIBLE)
const cementGeom = new THREE.CylinderGeometry(1.48,1.48,2,64); // altura inicial 2
const cementMat = new THREE.MeshStandardMaterial({color:0xb8b8b8});
const cement = new THREE.Mesh(cementGeom, cementMat);
cement.position.y=1; // la mitad de su altura para que suba desde abajo
scene.add(cement);

// ANIMACION DE NIVEL
let level = 2; // altura inicial
setInterval(()=>{
  level = Math.random()*4; // simula nivel 0-4
  gsap.to(cement.scale,{y:level/2, duration:1}); // escala
  gsap.to(cement.position,{y:level/2, duration:1}); // posición
},2000);

// ANIMACION LOOP
function animate(){
  requestAnimationFrame(animate);
  body.rotation.y +=0.002;
  cone.rotation.y +=0.002;
  cement.rotation.y +=0.002;
  renderer.render(scene,camera);
}
animate();

// RESIZE
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
